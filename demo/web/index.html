<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知学 · 智慧学习平台</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" type="module"></script>
</head>
<body>
  <div id="platform"></div>
  <template id="video-template">
  <main>
    <section class="intro"><div class="eyebrow">VIDEO → LEARNING MATERIALS</div><h1>把一段课程，<br>变成随时翻阅的资料。</h1><p>选择课程视频，自动整理课件页面与音频。<br class="mobile-break">处理完成后，保存 PDF、JPG 或 MP3。</p><div class="intro-tags"><span>无需 API</span><span>视频留在本机</span><span>轻量课件提取</span></div></section>
    <section class="workspace">
      <div class="panel upload-panel">
        <div class="section-heading"><span class="step-number">01</span><div><h2>选择课程视频</h2><p>适合课件为主、画面相对稳定的课程录屏</p></div></div>
        <label id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择视频文件">
          <input id="file" type="file" accept="video/*,.mkv,.ts,.mts,.m4v" hidden>
          <span class="upload-symbol" aria-hidden="true">↑</span>
          <strong id="file-title">点击选择，或将视频拖到这里</strong>
          <span id="file-detail">MP4 / MOV / MKV / AVI / WebM · 最大 8 GB</span>
          <span class="select-link">打开文件管理器 ↗</span>
        </label>
        <div class="settings"><label for="profile">页面提取模式</label><select id="profile"><option value="balanced">均衡 · 推荐用于普通课程</option><option value="detailed">细致 · 保留更多局部内容变化</option><option value="compact">精简 · 减少相似页面</option></select><p id="profile-help">每秒检查 5 帧，等待画面稳定后保留页面，并去除重复内容。</p></div>
        <button class="button primary" id="start" disabled>确认视频并开始整理 <span>→</span></button>
        <p class="local-note">文件仅传入本机服务，不会发送到互联网。</p>
      </div>
      <div class="panel status-panel">
        <div class="section-heading"><span class="step-number">02</span><div><h2>整理与导出</h2><p>从视频到可保存的学习资料</p></div></div>
        <div id="idle" class="idle-state"><div class="page-stack"><span></span><span></span><span>PDF<br><small>课程资料</small></span></div><h3>等你放入第一段视频</h3><p>提取清晰页面，按出现顺序合成 PDF，<br>再将音频单独保存为 MP3。</p></div>
        <div id="processing" hidden aria-live="polite"><div class="processing-top"><span id="state-label">正在处理</span><strong id="percent">0%</strong></div><progress id="progress" max="100" value="0"></progress><p id="message">准备开始</p><ol class="stage-list"><li data-stage="uploading">视频传入本机</li><li data-stage="scanning">识别稳定画面</li><li data-stage="extracting">导出 JPG 与 PDF</li><li data-stage="audio">单独提取音频</li></ol><button class="button secondary" id="cancel">取消当前任务</button></div>
        <div id="result" hidden aria-live="polite"><div class="success-icon">✓</div><h3>学习资料已就绪</h3><p id="result-meta"></p><div id="warnings"></div><div class="download-list"><a class="download-link primary-download" id="pdf-download" href="#" download><span><b>课件 PDF</b><small>按原画面比例，一页一张</small></span><span>保存 ↓</span></a><a class="download-link" id="audio-download" href="#" download><span><b>课程音频 MP3</b><small>可独立播放，方便回听</small></span><span>保存 ↓</span></a><a class="download-link" id="zip-download" href="#" download><span><b>全部课件 JPG</b><small>图片压缩包，保留清晰原图</small></span><span>保存 ↓</span></a></div><p class="save-note">保存位置由浏览器决定；可在浏览器下载设置中开启“每次询问保存位置”。</p></div>
        <div id="error" class="error-box" hidden role="alert"></div>
      </div>
    </section>
    <section id="preview-section" class="preview-section" hidden><div class="preview-heading"><div><span class="eyebrow">EXTRACTED PAGES</span><h2>课件预览 <span id="page-count"></span></h2></div><p>点击查看原图 · 时间为页面代表帧位置</p></div><div id="gallery" class="gallery"></div></section>
    <section id="history-section" class="history-section" hidden><div class="preview-heading"><h2>最近任务</h2><span>刷新网页后仍可继续查看</span></div><div id="history"></div></section>
    <footer>知学 · 本地视频学习工作台 <span>JPG 页面检测 / PDF 合并 / 音频提取</span></footer>
  </main>
  <dialog id="image-dialog"><div class="dialog-bar"><span id="dialog-caption"></span><button id="close-dialog" aria-label="关闭原图">✕</button></div><img id="dialog-image" alt="课件原图"></dialog>
  </template>
</body>
</html>
